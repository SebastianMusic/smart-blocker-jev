<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart Blocker Jev</title>
  <link rel="stylesheet" href="pages.css">
  <style>body { width: 340px; padding: 12px; }</style>
</head>
<body class="stack">
  <div class="row spread">
    <h1>Smart Blocker Jev</h1>
    <label class="row" style="margin:0;font-weight:400"><input type="checkbox" id="enabled"> On</label>
  </div>

  <div class="card banner" id="paused" hidden>
    <p><strong>jev calls paused:</strong> <span id="pause-reason"></span></p>
    <p class="muted">Until <span id="pause-until"></span></p>
    <button id="resume">Resume now</button>
  </div>

  <div class="card">
    <label for="intention">What do you want to use the internet for?</label>
    <textarea id="intention" rows="3" placeholder="e.g. Researching and writing my thesis on coastal erosion"></textarea>
    <div class="row spread" style="margin-top:8px">
      <span class="muted">Saving clears cached verdicts.</span>
      <button class="primary" id="save" disabled>Save</button>
    </div>
  </div>

  <div class="card" id="tab-card">
    <div class="row spread">
      <h2 style="margin:0">This tab</h2>
      <span class="badge" id="tab-state"></span>
    </div>
    <p id="tab-detail"></p>
    <p class="muted" id="tab-noul"></p>
  </div>

  <div class="card">
    <p class="muted"><span id="calls"></span> jev calls today · <span id="cached"></span> cached verdicts (<span id="blocked"></span> blocked)</p>
    <div class="row" style="margin-top:8px">
      <button id="flush">Flush verdicts</button>
      <button id="options">Settings</button>
      <button id="debug">Debug log</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
